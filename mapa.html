<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛰️ GPS-RT Monitor en Tiempo Real</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0;
            color: #333;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        .overlay-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            color: #0078d7;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .stat-value {
            font-weight: bold;
            color: #009955;
        }

        .connection-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff0000;
            margin-right: 8px;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        .connection-status.active {
            background-color: #00cc00;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        /* Marcadores personalizados */
        .custom-icon {
            font-size: 24px;
            text-align: center;
            line-height: 24px;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
        }

        /* Popup Scoped Styles */
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.2);
        }

        .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.95);
        }

        .popup-title {
            font-weight: bold;
            color: #0078d7;
            margin-bottom: 5px;
            font-size: 1.1em;
            border-bottom: 1px solid #eee;
            padding-bottom: 3px;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            pointer-events: none;
            transition: opacity 0.5s;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="overlay-panel">
        <h1>
            <span id="status-dot" class="connection-status"></span>
            Monitor GPS-RT
        </h1>
        <div class="stats">
            <div class="stat-item">
                <span>Dispositivos Activos:</span>
                <span id="active-devices" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span>Mensajes Totales:</span>
                <span id="total-msgs" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span>Última Act.:</span>
                <span id="last-update" class="stat-value">-</span>
            </div>
        </div>
        <div style="margin-top: 15px; font-size: 0.8em; color: #666; text-align: center;">
            Grupo 46 - Redes de Computadoras
        </div>
    </div>

    <div id="loading" class="loading">Conectando con servidor...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Configuración inicial del mapa (Centrado en Cochabamba)
        const map = L.map('map').setView([-17.3894, -66.0588], 15);

        // Capa de mapa claro (OpenStreetMap estándar)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        const markers = {};
        const traces = {}; // Para guardar las líneas de rastro

        // Colores para las rutas
        const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF3'];

        function getColor(id) {
            // Hash simple para asignar color consistente a cada ID
            let hash = 0;
            if (typeof id === 'string') {
                for (let i = 0; i < id.length; i++) {
                    hash = id.charCodeAt(i) + ((hash << 5) - hash);
                }
            } else {
                hash = id;
            }
            const index = Math.abs(hash) % colors.length;
            return colors[index];
        }

        async function updateData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                // Actualizar contadores
                document.getElementById('active-devices').textContent = Object.keys(data.clients).length;
                document.getElementById('total-msgs').textContent = data.message_count;
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

                // Actualizar estado de conexión
                const statusDot = document.getElementById('status-dot');
                statusDot.classList.add('active');
                document.getElementById('loading').style.opacity = '0';

                // Procesar clientes
                const currentIds = new Set();

                for (const [id, client] of Object.entries(data.clients)) {
                    currentIds.add(id);

                    // Determinar icono
                    let iconEmoji = '🚗';
                    if (client.device_id) { // Intento de adivinar tipo por nombre si se pasara, por ahora genérico
                        // Podríamos mapear IDs a tipos si el backend lo enviara
                    }

                    const customIcon = L.divIcon({
                        className: 'custom-icon',
                        html: `<div style="font-size: 24px;">${iconEmoji}</div>`,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const popupContent = `
                        <div class="popup-title">Dispositivo ${id.substring(0, 8)}...</div>
                        <div class="popup-row"><span>Lat:</span> <b>${client.latitude.toFixed(5)}</b></div>
                        <div class="popup-row"><span>Lon:</span> <b>${client.longitude.toFixed(5)}</b></div>
                        <div class="popup-row"><span>Alt:</span> <b>${client.altitude} m</b></div>
                        <div class="popup-row"><span>Bat:</span> <b style="color: ${client.battery > 20 ? '#0f0' : '#f00'}">${client.battery}%</b></div>
                        <div class="popup-row"><span>Señal:</span> <b>${client.signal}%</b></div>
                        <div class="popup-row" style="margin-top:5px; font-size:0.8em; color:#888">Último: ${new Date(client.timestamp).toLocaleTimeString()}</div>
                    `;

                    const latlng = [client.latitude, client.longitude];

                    if (markers[id]) {
                        // Actualizar marcador existente
                        markers[id].setLatLng(latlng);
                        markers[id].setPopupContent(popupContent);

                        // Actualizar rastro
                        traces[id].addLatLng(latlng);
                    } else {
                        // Crear nuevo marcador
                        markers[id] = L.marker(latlng, { icon: customIcon })
                            .addTo(map)
                            .bindPopup(popupContent);

                        // Crear rastro
                        traces[id] = L.polyline([latlng], {
                            color: getColor(id),
                            weight: 3,
                            opacity: 0.7
                        }).addTo(map);
                    }
                }

                // Limpiar marcadores viejos (desconectados)
                for (const id in markers) {
                    if (!currentIds.has(id)) {
                        map.removeLayer(markers[id]);
                        map.removeLayer(traces[id]);
                        delete markers[id];
                        delete traces[id];
                    }
                }

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('status-dot').classList.remove('active');
            }
        }

        // Actualizar cada 1 segundo
        setInterval(updateData, 1000);
        updateData();
    </script>
</body>

</html>
